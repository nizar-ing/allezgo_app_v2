<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default title/description — overridden per-page by React 19 metadata hoisting -->
    <title>AllezGoo — Agence de Voyage Algérienne</title>
    <meta name="description" content="AllezGoo est votre agence de voyage en Algérie : hôtels en Tunisie, voyages organisés, omra et e-visas. Réservez en ligne au meilleur prix." />

    <!-- Open Graph defaults (overridden per-page) -->
    <meta property="og:site_name" content="AllezGoo" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://allezgoo.com/" />
    <meta property="og:title" content="AllezGoo — Agence de Voyage Algérienne" />
    <meta property="og:description" content="AllezGoo est votre agence de voyage en Algérie : hôtels en Tunisie, voyages organisés, omra et e-visas. Réservez en ligne au meilleur prix." />
    <meta property="og:image" content="https://allezgoo.com/images/og-default.jpg" />

    <!-- Twitter card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AllezGoo — Agence de Voyage Algérienne" />
    <meta name="twitter:description" content="AllezGoo est votre agence de voyage en Algérie : hôtels en Tunisie, voyages organisés, omra et e-visas." />

    <!-- Language signals -->
    <link rel="alternate" hreflang="fr" href="https://allezgoo.com/" />
    <link rel="alternate" hreflang="ar" href="https://allezgoo.com/" />
    <link rel="canonical" href="https://allezgoo.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
